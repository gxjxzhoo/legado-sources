name: update
on:
  schedule: [{cron: '0 20 * * *'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python build.py
      - run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources.json purify.json dict.json txttoc.json
          git diff --cached --quiet || (git commit -m "update $(date -u +%F)" && git pull --rebase origin main && git push)
      - name: purge jsDelivr cache
        run: for f in sources purify dict txttoc; do curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f.json" >/dev/null || true; done
